<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Face Puppet</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-bg="transparent">
  <main class="stage"><canvas id="puppet"></canvas></main>
  <div id="errorBanner" hidden></div>

  <aside class="panel">
    <h1>Face Puppet <small>calibration</small></h1>
    <button id="present" class="primary">Start presenting</button>
    <p class="hint">Presenting hides this panel. Press <kbd>Esc</kbd> or double-click the picture to come back.</p>

    <fieldset>
      <legend>Output</legend>
      <label class="row"><input type="checkbox" id="mask"> Mask mode (head covers my face)</label>
      <label class="row"><input type="checkbox" id="headOnly"> Head only (no neck/body)</label>
      <label>Background
        <select id="bg">
          <option value="video">My webcam video</option>
          <option value="transparent">Transparent</option>
          <option value="green">Green screen</option>
          <option value="dark">Dark</option>
        </select>
      </label>
    </fieldset>

    <fieldset>
      <legend>Mask size &amp; centering</legend>
      <label>Head width <input type="range" id="maskW" min="0.5" max="2.5" step="0.01"></label>
      <label>Head height <input type="range" id="maskH" min="0.5" max="2.5" step="0.01"></label>
      <label>Center left / right <input type="range" id="offX" min="-0.5" max="0.5" step="0.01"></label>
      <label>Center up / down <input type="range" id="offY" min="-0.5" max="0.5" step="0.01"></label>
    </fieldset>

    <fieldset>
      <legend>Tracking</legend>
      <button id="calibrate">Set neutral pose (C)</button>
      <label>Camera <select id="cam"></select></label>
      <label class="row"><input type="checkbox" id="mirror"> Mirror movement</label>
      <label class="row"><input type="checkbox" id="swapEyes"> Swap left/right eyes</label>
      <label class="row"><input type="checkbox" id="showCam"> Show raw webcam</label>
      <label>Mouth open sensitivity <input type="range" id="mouthGain" min="0.5" max="8" step="0.05"></label>
      <div class="meter" title="Live mouth openness after sensitivity. Ticks: small, mid, wide mouth shapes.">
        <div id="mouthBar"></div><i style="left:4.5%"></i><i style="left:14%"></i><i style="left:32%"></i>
      </div>
      <label>Expression sensitivity (brows, smile, frown) <input type="range" id="exprGain" min="0.5" max="4" step="0.05"></label>
      <label>Head motion <input type="range" id="headGain" min="0" max="2" step="0.05"></label>
      <video id="preview" playsinline muted></video>
    </fieldset>

    <fieldset>
      <legend>OBS</legend>
      <p class="hint">Browser Source URL. Includes all settings above, since OBS doesn't share this browser's saved settings.</p>
      <div class="row"><input id="obsUrl" readonly><button id="copyUrl">Copy</button></div>
    </fieldset>

    <p id="status">Starting…</p>
  </aside>

  <script type="module" src="src/main.js"></script>
</body>
</html>
